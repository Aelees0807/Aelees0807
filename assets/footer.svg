<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 92" width="960" height="92">
 <defs>
  <style type="text/css"><![CDATA[
    .fdot  { animation: fblink 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .fdot2 { animation: fblink 2.4s ease-in-out .5s infinite; transform-box: fill-box; transform-origin: center; }
    .fdot3 { animation: fblink 2.4s ease-in-out 1s infinite; transform-box: fill-box; transform-origin: center; }
